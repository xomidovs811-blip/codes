; Copy this file to config.ini and fill in the values.
; config.ini is git-ignored - never commit the bot token.

[telegram]
; Token from @BotFather (or set environment variable TELEGRAM_BOT_TOKEN instead)
bot_token = PASTE_BOT_TOKEN_HERE
; Group the report goes to
chat_id = -1004431975944
; Optional: your personal chat id - errors are sent here. Leave empty to only log errors.
admin_chat_id =
; Also send the ready text from the hidden "Telegram" sheet as a message
send_text = true

[excel]
; Folder with the monthly files "Скидки отчёт 2026-10.xlsx", "Скидки отчёт 2026-11.xlsx", ...
report_folder = \\192.168.1.101\Auditor\AUDIT\Скидки\Скидки отчёт
file_base_name = Скидки отчёт
; Used only once, when the folder has no monthly file yet: the current workbook to start from
template_file = \\192.168.1.101\Auditor\AUDIT\Скидки\Скидки отчёт.xlsx
report_sheet = Отчёт
report_date_cell = C4
telegram_text_range = Telegram_текст
; Power Query whose [Дата2] filter is moved to the report month
query_name = База_продаж
refresh_timeout_min = 30

[general]
; Defaults: next to the script
; state_file = C:\SkidkiReport\sent_state.json
; log_file = C:\SkidkiReport\logs\skidki_report.log
